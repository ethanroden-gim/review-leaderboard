<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- Ignored by Apps Script (see the doGet note in the hand-off), but makes a local preview behave. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOA Insurance Agency — Review Contest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       HOA Insurance Agency — Review Contest Leaderboard (TV build)

       Every size below is a "stage pixel" on a fixed 1920 x 1080 design
       canvas. A small script scales the whole stage to whatever window the
       TV browser actually reports, so the layout is pixel-identical on a
       Fire TV Stick (which usually reports a 960x540 or 980-wide CSS
       viewport), a 1080p PC, or a 4K panel. Nothing is fluid, nothing wraps,
       nothing can run off the bottom of the screen.
       ===================================================================== */
    :root {
      --navy: #1A365D;
      --navy-deep: #132A4A;
      --gold: #D3AC5A;
      --gold-deep: #B5872E;
      --gold-pale: #E7CD97;
      --cream: #FBF7EE;
      --silver: #B9C4D1;
      --silver-deep: #8492A6;
      --bronze: #C97F4B;
      --bronze-deep: #8B5A2B;
      --slate-50: #F8FAFC;
      --slate-100: #F1F5F9;
      --slate-200: #E2E8F0;
      --slate-300: #CBD5E1;
      --slate-400: #94A3B8;
      --slate-500: #64748B;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-900: #0F172A;
      --radius-pill: 999px;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.10), 0 3px 8px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EEF2F7;
      color: var(--slate-900);
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 400;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      /* Android WebViews (Fire TV) may otherwise "boost" text in wide blocks. */
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    /* ---------- Viewport shell + scaled stage ---------- */
    .viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EEF2F7;
    }
    .stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ribbon-corner {
      position: absolute;
      top: -46px;
      left: -46px;
      width: 230px;
      height: 230px;
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 4px 7px rgba(15,23,42,0.28));
    }

    /* ---------- Header: full-bleed navy banner ---------- */
    .header-wrap {
      position: relative;
      z-index: 1;
      flex: none;
      height: 210px;
      overflow: hidden;
      background: radial-gradient(130% 220% at 10% 0%, #1c3f6b 0%, var(--navy-deep) 55%, #0a1930 100%);
    }
    .header-wrap::before {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background:
        radial-gradient(circle at 88% -30%, rgba(211,172,90,0.16) 0%, transparent 48%),
        radial-gradient(circle at 100% 80%, rgba(211,172,90,0.10) 0%, transparent 45%),
        repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 3px, transparent 3px, transparent 48px);
      pointer-events: none;
    }
    .header-skyline {
      position: absolute;
      right: 24px;
      bottom: 44px;
      width: 700px;
      height: 200px;
      z-index: 1;
      pointer-events: none;
    }
    .header-wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      width: 100%;
      height: 58px;
      z-index: 3;
      display: block;
    }
    .header-inner {
      position: relative;
      z-index: 2;
      width: 1920px;
      height: 154px;
      margin: 0 auto;
      padding: 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { flex: none; width: 420px; }
    /* Full-color lockup sits on a white plate so the navy wordmark reads against the navy band. */
    .logo-plate {
      display: inline-block;
      background: #fff;
      border-radius: 14px;
      padding: 15px 22px 13px;
      box-shadow: 0 8px 22px rgba(4, 12, 28, 0.35);
    }
    .header-left .lockup { height: 70px; display: block; }

    .header-center { flex: 1 1 auto; text-align: center; min-width: 0; padding: 0 24px; }
    .header-center .eyebrow-light {
      color: var(--gold);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .header-center h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: 68px;
      margin: 0 0 12px;
      line-height: 1.05;
      white-space: nowrap;
      background: linear-gradient(180deg, #FFFFFF 0%, #F7EDD8 45%, #E4C88C 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .gold-rule-center { width: 160px; height: 3px; background: var(--gold); margin: 0 auto; }

    .header-right {
      flex: none;
      width: 420px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .sun-mark { width: 84px; height: 54px; display: block; flex: none; }
    .tagline-divider { width: 2px; height: 64px; background: rgba(211,172,90,0.45); margin: 0 22px 0 20px; flex: none; }
    .tagline-col { display: flex; flex-direction: column; text-align: left; }
    .tagline-col span {
      color: var(--gold-pale);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.5;
      white-space: nowrap;
    }

    /* ---------- Content column ---------- */
    .content {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #FFFFFF 0%, #F4F7FB 55%, #EEF2F7 100%);
    }
    main {
      flex: none;
      width: 1920px;
      margin: 0 auto;
      padding: 18px 72px 0;
      position: relative;
    }

    /* ---------- Corner-bracket accent (echoes the header's frame) ---------- */
    .corner-accent::after {
      content: "";
      position: absolute;
      top: 14px;
      right: 14px;
      width: 20px;
      height: 20px;
      border-top: 3px solid var(--gold);
      border-right: 3px solid var(--gold);
      opacity: 0.55;
      border-radius: 0 4px 0 0;
      pointer-events: none;
    }

    /* ---------- Stat row ---------- */
    .stats {
      display: flex;
      align-items: center;
      height: 124px;
      background: linear-gradient(180deg, #ffffff 0%, var(--slate-50) 100%);
      border: 2px solid var(--slate-200);
      border-top: 4px solid var(--gold);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding: 0 36px;
      position: relative;
    }
    .stat-seg { display: flex; align-items: center; flex: none; }
    .stat-seg.grow { flex: 1 1 auto; min-width: 0; }
    .stat-divider { width: 2px; height: 76px; background: var(--slate-200); margin: 0 36px; flex: none; }
    .stat-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(26, 54, 93, 0.08);
      border: 2px solid rgba(26, 54, 93, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 18px;
      flex: none;
    }
    .stat-icon { width: 26px; height: 26px; color: var(--navy); display: block; }
    .stat-text-col { flex: none; min-width: 0; }
    .stat-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate-600);
      line-height: 1.2;
      white-space: nowrap;
    }
    .stat-value-row { display: flex; align-items: baseline; white-space: nowrap; margin-top: 6px; }
    .stat-value {
      font-size: 56px;
      font-weight: 900;
      color: var(--slate-900);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .stat-suffix { font-size: 22px; color: var(--slate-600); font-weight: 600; margin-left: 12px; }
    .stat-suffix .dot { color: var(--slate-300); margin-right: 10px; }

    .progress-block { flex: 1 1 auto; min-width: 0; max-width: 640px; margin-left: 40px; align-self: center; }
    .progress-track {
      height: 14px;
      width: 100%;
      border-radius: 8px;
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--navy) 0%, var(--navy-deep) 100%);
      transition: width 0.6s ease;
    }
    .progress-caption {
      margin-top: 8px;
      font-size: 20px;
      line-height: 1.2;
      color: var(--slate-600);
      display: flex;
      justify-content: space-between;
      white-space: nowrap;
    }
    .progress-caption .pct { color: var(--gold-deep); font-weight: 700; }

    /* ---------- Section titles ---------- */
    .section-title {
      display: flex;
      align-items: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-deep);
      line-height: 1.2;
      margin: 22px 0 14px;
    }
    .section-title::before {
      content: "";
      width: 40px;
      height: 3px;
      background: var(--gold);
      margin-right: 16px;
      flex: none;
    }
    .st-line {
      flex: 1 1 auto;
      height: 2px;
      margin-left: 18px;
      background: linear-gradient(90deg, var(--slate-200) 0%, rgba(226,232,240,0) 100%);
    }
    .st-note {
      flex: none;
      margin-left: 18px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--slate-500);
      white-space: nowrap;
    }
    .st-note:empty { display: none; }

    /* ---------- Top 3 podium ---------- */
    .top3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 28px;
      gap: 28px;
    }
    .rank-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      height: 216px;
      border: 2px solid var(--slate-200);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      padding: 22px 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fff;
      min-width: 0;
    }
    .rank-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
    }
    .ray-burst {
      position: absolute;
      top: 72px;
      left: 93px;
      width: 260px;
      height: 260px;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      z-index: -1;
      pointer-events: none;
      background: repeating-conic-gradient(from -8deg, rgba(255,255,255,0.85) 0deg 3deg, transparent 3deg 15deg);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 0%, black 38%, transparent 66%);
      mask-image: radial-gradient(circle at 50% 50%, black 0%, black 38%, transparent 66%);
      opacity: 0.6;
    }
    .rank-card.rank-gold {
      background:
        radial-gradient(circle at 10% 35%, rgba(211,172,90,0.26), transparent 50%),
        linear-gradient(100deg, #FBF1D9 0%, #FFFFFF 62%);
      border-color: var(--gold);
      box-shadow: 0 14px 34px rgba(211, 172, 90, 0.22), var(--shadow-md);
    }
    .rank-card.rank-gold::before { background: linear-gradient(90deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-deep) 100%); }
    .rank-card.rank-silver {
      background:
        radial-gradient(circle at 10% 35%, rgba(148,163,184,0.22), transparent 50%),
        linear-gradient(100deg, #EEF2F6 0%, #FFFFFF 62%);
      border-color: var(--silver);
    }
    .rank-card.rank-silver::before { background: linear-gradient(90deg, var(--silver-deep) 0%, var(--silver) 50%, var(--silver-deep) 100%); }
    .rank-card.rank-bronze {
      background:
        radial-gradient(circle at 10% 35%, rgba(201,127,75,0.22), transparent 50%),
        linear-gradient(100deg, #FBEADD 0%, #FFFFFF 62%);
      border-color: var(--bronze);
    }
    .rank-card.rank-bronze::before { background: linear-gradient(90deg, var(--bronze-deep) 0%, var(--bronze) 50%, var(--bronze-deep) 100%); }

    .rank-card.rank-empty {
      border: 2px dashed var(--slate-300);
      background: #fff;
      box-shadow: none;
    }
    .rank-empty .laurel { color: var(--slate-300); }
    .medal.medal-empty {
      background: var(--slate-100);
      color: var(--slate-400);
      border-color: var(--slate-300);
      box-shadow: none;
    }
    .name.empty-slot-name {
      color: var(--slate-400);
      font-style: italic;
      font-weight: 600;
    }

    .rc-row { display: flex; align-items: center; min-width: 0; }
    .medal-row { display: flex; align-items: center; flex: none; margin-right: 22px; }
    .laurel { width: 30px; height: 50px; flex: none; opacity: 0.92; display: block; }
    .laurel-r { -webkit-transform: scaleX(-1); transform: scaleX(-1); }
    .rank-gold .laurel { color: var(--gold-deep); }
    .rank-silver .laurel { color: var(--silver-deep); }
    .rank-bronze .laurel { color: var(--bronze-deep); }

    .medal {
      width: 66px;
      height: 66px;
      margin: 0 2px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      border: 2px solid;
      flex: none;
    }
    .medal.medal-gold {
      background: radial-gradient(circle at 34% 28%, #F6E2AC 0%, var(--gold) 55%, var(--gold-deep) 100%);
      color: var(--navy-deep);
      border-color: var(--gold-deep);
      box-shadow: 0 0 0 6px rgba(211, 172, 90, 0.16), var(--shadow-sm);
    }
    .medal.medal-silver {
      background: radial-gradient(circle at 34% 28%, #F8FAFC 0%, var(--silver) 55%, var(--silver-deep) 100%);
      color: var(--navy-deep);
      border-color: var(--silver-deep);
      box-shadow: 0 0 0 6px rgba(148, 163, 184, 0.14), var(--shadow-sm);
    }
    .medal.medal-bronze {
      background: radial-gradient(circle at 34% 28%, #F0C49B 0%, var(--bronze) 55%, var(--bronze-deep) 100%);
      color: #fff;
      border-color: var(--bronze-deep);
      box-shadow: 0 0 0 6px rgba(201, 127, 75, 0.16), var(--shadow-sm);
    }

    .rc-meta { flex: 1 1 auto; min-width: 0; }
    .place-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate-600);
      white-space: nowrap;
      line-height: 1.2;
    }
    .prize-amount {
      display: inline-block;
      margin-top: 8px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--gold-deep);
      background: rgba(211, 172, 90, 0.14);
      border: 2px solid rgba(211, 172, 90, 0.3);
      border-radius: var(--radius-pill);
      padding: 3px 18px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .rc-count-col {
      flex: none;
      text-align: center;
      padding-left: 26px;
      margin-left: 14px;
      border-left: 2px solid rgba(15, 23, 42, 0.08);
    }
    .rank-card .count {
      font-size: 68px;
      font-weight: 900;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .rank-card .count-label {
      font-size: 20px;
      color: var(--slate-600);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .rank-card .name {
      margin-top: 16px;
      font-size: 46px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--slate-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    /* ---------- Leaderboard table (ranks 4-7) ---------- */
    .table-wrap {
      border: 2px solid var(--slate-200);
      border-top: 4px solid var(--gold);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      background: #fff;
    }
    table.rest {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }
    table.rest th {
      height: 48px;
      text-align: left;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      background: linear-gradient(90deg, var(--navy) 0%, var(--navy-deep) 100%);
      padding: 0 34px;
      border-bottom: 3px solid var(--gold-deep);
      white-space: nowrap;
    }
    table.rest th.col-rank { width: 140px; }
    table.rest th.col-reviews { width: 240px; text-align: right; color: #fff; }
    table.rest td {
      height: 64px;
      padding: 0 34px;
      border-bottom: 2px solid var(--slate-100);
      font-size: 30px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    table.rest tr:last-child td { border-bottom: none; }
    table.rest tbody tr:nth-child(even) td { background: var(--cream); }
    table.rest td.employee { font-weight: 600; }
    table.rest td.reviews {
      text-align: right;
      font-weight: 800;
      font-size: 34px;
      font-variant-numeric: tabular-nums;
      color: var(--navy);
    }
    .rank-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--slate-100);
      border: 2px solid var(--slate-200);
      color: var(--navy);
      font-weight: 800;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      vertical-align: middle;
    }
    .rank-chip.muted { background: transparent; border-color: var(--slate-300); color: var(--slate-400); }
    table.rest tr.open td { color: var(--slate-400); font-style: italic; font-weight: 500; }
    table.rest tr.open td.reviews { color: var(--slate-400); font-style: normal; }

    .empty-state {
      grid-column: 1 / -1;
      height: 216px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 2px dashed var(--slate-300);
      border-radius: 18px;
      padding: 24px 40px;
      text-align: center;
      font-size: 28px;
      color: var(--slate-600);
    }

    /* ---------- "No reviews yet" podium placeholder ---------- */
    .empty-podium {
      grid-column: 1 / -1;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      height: 216px;
      border: 2px dashed var(--gold);
      border-radius: 18px;
      background: linear-gradient(160deg, #FFFCF3 0%, #FFFFFF 65%);
      padding: 0 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .empty-podium-ray {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      height: 520px;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      z-index: -1;
      pointer-events: none;
      background: repeating-conic-gradient(from -8deg, rgba(211,172,90,0.4) 0deg 3deg, transparent 3deg 15deg);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 0%, black 26%, transparent 58%);
      mask-image: radial-gradient(circle at 50% 50%, black 0%, black 26%, transparent 58%);
      opacity: 0.8;
    }
    .empty-podium-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 28%, #F6E2AC 0%, var(--gold) 55%, var(--gold-deep) 100%);
      border: 2px solid var(--gold-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 8px rgba(211, 172, 90, 0.14);
    }
    .empty-podium-icon svg { width: 34px; height: 34px; color: var(--navy-deep); display: block; }
    .empty-podium-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: 36px;
      line-height: 1.1;
      color: var(--navy-deep);
      margin-bottom: 8px;
    }
    .empty-podium-sub {
      font-size: 22px;
      color: var(--slate-600);
      max-width: 1100px;
      margin: 0 auto;
      line-height: 1.4;
    }
    .empty-podium-sub strong { color: var(--gold-deep); font-weight: 700; }

    /* ---------- Footer strip: script tagline + status ---------- */
    .footer {
      flex: none;
      margin-top: auto;
      width: 1920px;
      margin-left: auto;
      margin-right: auto;
      padding: 12px 72px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .bg-script {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.1;
      color: var(--gold-deep);
      -webkit-transform: rotate(-2deg);
      transform: rotate(-2deg);
      -webkit-transform-origin: left center;
      transform-origin: left center;
      opacity: 0.95;
      padding-left: 6px;
      white-space: nowrap;
    }
    .status-line {
      display: flex;
      align-items: center;
      font-size: 22px;
      line-height: 1.2;
      color: var(--slate-600);
      white-space: nowrap;
    }
    .pulse {
      width: 12px;
      height: 12px;
      margin-right: 12px;
      border-radius: 50%;
      background: var(--gold-deep);
      display: inline-block;
      box-shadow: 0 0 0 4px rgba(211, 172, 90, 0.2);
      flex: none;
    }
    .status-note { display: flex; align-items: center; }
    .status-note:empty { display: none; }
    .status-sep { margin: 0 14px; color: var(--slate-300); }
    .status-note strong { color: var(--gold-deep); font-weight: 700; }
  </style>
</head>

              <div class="stat-icon-badge"><svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
              <div class="stat-text-col">
                <div class="stat-label">Employees Participating</div>
                <div class="stat-value-row"><span class="stat-value" id="statParticipants">0</span></div>
              </div>
            </div>

            <div class="stat-divider"></div>

            <div class="stat-seg">
              <div class="stat-icon-badge"><svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></div>
              <div class="stat-text-col">
                <div class="stat-label">Contest Ends</div>
                <div class="stat-value-row">
                  <span class="stat-value" id="statEndDate">—</span>
                  <span class="stat-suffix" id="statDaysLeft"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="section-title">Top standings<span class="st-line"></span></div>
          <div id="top3" class="top3"></div>

          <div class="section-title">Leaderboard<span class="st-line"></span><span class="st-note" id="restNote"></span></div>
          <div id="restWrap"></div>
        </main>

        <div class="footer">
          <div class="bg-script">Stronger Communities Together</div>
          <div class="status-line">
            <span class="pulse" id="pulseDot"></span>
            <span id="updatedAt">Loading…</span>
            <span class="status-note" id="statusNote"></span>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
  // ---------------------------------------------------------------------
  // Stage scaling. The page is laid out on a fixed 1920 x 1080 canvas and
  // scaled to the real window, so the TV browser's reported CSS viewport
  // (Fire TV Sticks commonly report 960x540, or a 980px-wide legacy
  // viewport when no viewport meta tag reaches the page) never changes the
  // layout. If the window is not exactly 16:9 the stage grows along the
  // longer axis so no black bars ever appear.
  // ---------------------------------------------------------------------
  (function () {
    var DESIGN_W = 1920, DESIGN_H = 1080;
    function fitStage() {
      var vp = document.getElementById('viewport');
      var st = document.getElementById('stage');
      if (!vp || !st) return;
      var w = window.innerWidth || document.documentElement.clientWidth;
      var h = window.innerHeight || document.documentElement.clientHeight;
      if (!w || !h) return;
      vp.style.width = w + 'px';
      vp.style.height = h + 'px';
      var s = Math.min(w / DESIGN_W, h / DESIGN_H);
      st.style.width = (w / s) + 'px';
      st.style.height = (h / s) + 'px';
      st.style.webkitTransform = 'scale(' + s + ')';
      st.style.transform = 'scale(' + s + ')';
    }
    fitStage();
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    window.addEventListener('load', fitStage);
    // Kiosk/poster WebViews can settle their real size a moment after first paint.
    setTimeout(fitStage, 300);
    setTimeout(fitStage, 1500);
    setTimeout(fitStage, 4000);
  })();

  var REFRESH_MS = 30 * 60 * 1000; // poll the sheet every 30 minutes (the Make.com review check runs every 3 hours)
  var TABLE_ROWS = 4;              // ranks 4-7 below the podium
  var PRIZES = { 1: '$2,000', 2: '$1,500', 3: '$500' };
  var current = { reviews: 0, participants: 0 };

  var LAUREL_PATHS =
    '<path d="M22 70 C 15 52, 15 28, 22 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
    '<g fill="currentColor">' +
      '<ellipse cx="17" cy="62" rx="10.5" ry="4.6" transform="rotate(-22 17 62)"/>' +
      '<ellipse cx="14" cy="50" rx="11" ry="4.8" transform="rotate(-33 14 50)"/>' +
      '<ellipse cx="12.5" cy="38" rx="11" ry="4.8" transform="rotate(-44 12.5 38)"/>' +
      '<ellipse cx="13" cy="26" rx="10.5" ry="4.4" transform="rotate(-56 13 26)"/>' +
      '<ellipse cx="16" cy="15" rx="9.5" ry="4" transform="rotate(-68 16 15)"/>' +
      '<ellipse cx="20" cy="6" rx="8" ry="3.4" transform="rotate(-82 20 6)"/>' +
    '</g>';
  var LAUREL_L = '<svg class="laurel laurel-l" viewBox="0 0 40 70">' + LAUREL_PATHS + '</svg>';
  var LAUREL_R = '<svg class="laurel laurel-r" viewBox="0 0 40 70">' + LAUREL_PATHS + '</svg>';

  function animateNumber(el, from, to, duration) {
    if (from === to) { el.textContent = to; return; }
    var start = null;
    function step(ts) {
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Long names shrink to fit their card (down to 30px) instead of truncating.
  function fitNames() {
    var els = document.querySelectorAll('.rank-card .name');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var size = 46;
      el.style.fontSize = size + 'px';
      while (el.scrollWidth > el.clientWidth && size > 30) {
        size -= 2;
        el.style.fontSize = size + 'px';
      }
    }
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitNames);
  }

  function buildTable(rest) {
    var rows = '';
    for (var i = 0; i < TABLE_ROWS; i++) {
      var e = rest[i];
      if (e) {
        rows += '<tr>' +
          '<td class="rank-num"><span class="rank-chip">' + e.rank + '</span></td>' +
          '<td class="employee">' + escapeHtml(e.name) + '</td>' +
          '<td class="reviews">' + e.reviews + '</td>' +
          '</tr>';
      } else {
        // Open slot — keeps the board the same height no matter how many people have placed.
        rows += '<tr class="open">' +
          '<td class="rank-num"><span class="rank-chip muted">' + (4 + i) + '</span></td>' +
          '<td class="employee">Open</td>' +
          '<td class="reviews">&mdash;</td>' +
          '</tr>';
      }
    }
    return '<div class="table-wrap"><table class="rest"><thead><tr>' +
        '<th class="col-rank">Rank</th><th>Employee</th><th class="col-reviews">Reviews</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function setStatusNote(unclaimed) {
    var el = document.getElementById('statusNote');
    if (unclaimed > 0) {
      el.innerHTML = '<span class="status-sep">&middot;</span><strong>' + unclaimed + '</strong> ' +
        (unclaimed === 1 ? 'review' : 'reviews') + ' awaiting assignment';
    } else {
      el.innerHTML = '';
    }
  }

  function render(data) {
    var top3El = document.getElementById('top3');
    var restWrap = document.getElementById('restWrap');
    var restNote = document.getElementById('restNote');

    if (data.error) {
      top3El.innerHTML = '<div class="empty-state">' + escapeHtml(data.error) + '</div>';
      restWrap.innerHTML = buildTable([]);
      restNote.textContent = '';
      setStatusNote(0);
      if (data.updatedAt) { updateStamp(data.updatedAt); }
      else { document.getElementById('updatedAt').textContent = 'Waiting for data'; }
      return;
    }
    hasRendered = true;

    var entries = data.entries || [];
    var totals = data.totals || { reviews: 0, participants: 0, goal: 30 };
    var unclaimed = data.unclaimed || 0;

    // --- Stat row ---
    animateNumber(document.getElementById('statReviews'), current.reviews, totals.reviews, 700);
    animateNumber(document.getElementById('statParticipants'), current.participants, totals.participants, 700);
    current.reviews = totals.reviews;
    current.participants = totals.participants;

    document.getElementById('statGoalSuffix').textContent = '/ ' + totals.goal + ' target';
    var pct = totals.goal > 0 ? Math.min(100, Math.round((totals.reviews / totals.goal) * 100)) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = totals.reviews + ' of ' + totals.goal;
    document.getElementById('progressPct').textContent = pct + '%';

    if (data.contestEnd) {
      var end = new Date(data.contestEnd);
      document.getElementById('statEndDate').textContent =
        end.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      var msLeft = end.getTime() - Date.now();
      var daysLeft = Math.ceil(msLeft / (1000 * 60 * 60 * 24));
      document.getElementById('statDaysLeft').innerHTML = '<span class="dot">&middot;</span>' +
        (daysLeft > 1 ? daysLeft + ' days left' : (daysLeft === 1 ? '1 day left' : 'Contest has ended'));
    }

    // --- Top 3 ---
    // Filled by sorted position (not by exact rank number) so a tie for a
    // podium spot never leaves a phantom empty card next to it.
    var top3 = entries.slice(0, 3);
    var rest = entries.slice(3, 3 + TABLE_ROWS);

    var placeLabels = { 1: '1st Place', 2: '2nd Place', 3: '3rd Place' };
    var rankClasses = { 1: 'rank-gold', 2: 'rank-silver', 3: 'rank-bronze' };
    var medalClasses = { 1: 'medal-gold', 2: 'medal-silver', 3: 'medal-bronze' };

    if (entries.length === 0) {
      // Nobody has a verified review yet — don't fabricate empty "0 review" cards.
      top3El.innerHTML =
        '<div class="empty-podium">' +
          '<div class="empty-podium-ray"></div>' +
          '<div class="empty-podium-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/>' +
              '<path d="M7 5H4a2 2 0 0 0 2 4c.3 0 .6-.05.9-.14"/><path d="M17 5h3a2 2 0 0 1-2 4c-.3 0-.6-.05-.9-.14"/>' +
            '</svg>' +
          '</div>' +
          '<div class="empty-podium-title">The podium is wide open</div>' +
          '<div class="empty-podium-sub">Nobody has claimed 1st place yet — <strong>' + PRIZES[1] + '</strong> is still on the table. Ask a happy customer for a Google review and put your name up first.</div>' +
        '</div>';
    } else {
      var top3Html = '';
      for (var slot = 1; slot <= 3; slot++) {
        var e = top3[slot - 1];
        if (!e) {
          // Fewer than 3 people have a review so far — show an open slot, not a phantom 0.
          top3Html +=
            '<div class="rank-card rank-empty">' +
              '<div class="rc-row">' +
                '<div class="medal-row">' + LAUREL_L + '<div class="medal medal-empty">' + slot + '</div>' + LAUREL_R + '</div>' +
                '<div class="rc-meta"><div class="place-label">' + placeLabels[slot] + '</div>' +
                  '<span class="prize-amount" style="opacity:.55">' + PRIZES[slot] + '</span></div>' +
              '</div>' +
              '<div class="name empty-slot-name">Awaiting entries</div>' +
            '</div>';
          continue;
        }
        var count = e.reviews;
        var countLabel = e.reviews === 1 ? 'Review' : 'Reviews';
        top3Html +=
          '<div class="rank-card corner-accent ' + rankClasses[slot] + '">' +
            '<div class="ray-burst"></div>' +
            '<div class="rc-row">' +
              '<div class="medal-row">' + LAUREL_L + '<div class="medal ' + medalClasses[slot] + '">' + slot + '</div>' + LAUREL_R + '</div>' +
              '<div class="rc-meta">' +
                '<div class="place-label">' + placeLabels[slot] + '</div>' +
                '<span class="prize-amount">' + PRIZES[slot] + '</span>' +
              '</div>' +
              '<div class="rc-count-col"><div class="count">' + count + '</div><div class="count-label">' + countLabel + '</div></div>' +
            '</div>' +
            '<div class="name">' + escapeHtml(e.name) + '</div>' +
          '</div>';
      }
      top3El.innerHTML = top3Html;
    }

    // --- Leaderboard (ranks 4-7), always four rows so the board never shifts ---
    restWrap.innerHTML = buildTable(rest);
    var extra = entries.length - (3 + TABLE_ROWS);
    restNote.textContent = extra > 0 ? '+' + extra + ' more competing' : '';

    setStatusNote(unclaimed);
    updateStamp(data.updatedAt);
    fitNames();
  }

  function updateStamp(iso) {
    var d = iso ? new Date(iso) : new Date();
    document.getElementById('updatedAt').textContent =
      'Updated ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' at ' +
      d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------------------------------------------------------------------
  // Data source — two modes, one file:
  //  1. Served by Apps Script (HtmlService): INITIAL_DATA is injected by the
  //     template below and refreshes go through google.script.run.
  //  2. Hosted as a plain static page (GitHub Pages, your web host, ...):
  //     the page fetches JSON from the Apps Script web app instead. Because
  //     no Apps Script HTML page is ever displayed, Google's "This
  //     application was created by a Google Apps Script user" bar can never
  //     appear. Point the TV at
  //       https://your-host/index.html?src=https://script.google.com/macros/s/XXXX/exec
  //     or paste the /exec URL into DEFAULT_DATA_URL. doGet must answer
  //     ?format=json with ContentService JSON (see the hand-off notes).
  // ---------------------------------------------------------------------
  var DEFAULT_DATA_URL = '';
  var RELOAD_MS = 24 * 60 * 60 * 1000; // static mode only: full reload once a day so a kiosk never goes stale
  var hasRendered = false;

  function hasAppsScript() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  function dataUrl() {
    var src = '';
    try { src = new URLSearchParams(window.location.search).get('src') || ''; } catch (e) {}
    src = src || DEFAULT_DATA_URL;
    if (!src) return '';
    // Only trust Apps Script web-app URLs, or a same-origin path (local testing).
    var isAppsScript = src.indexOf('https://script.google.com/macros/') === 0;
    var isSameOrigin = src.indexOf('http') !== 0 && src.indexOf('//') !== 0;
    return (isAppsScript || isSameOrigin) ? src : '';
  }

  function showError(message) {
    render({ error: message });
  }

  function fetchData() {
    var url = dataUrl();
    if (!url) {
      showError('No data source configured. Add ?src=<Apps Script /exec URL> to this page’s address, or set DEFAULT_DATA_URL in the file.');
      return;
    }
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    fetch(url + sep + 'format=json&t=' + Date.now(), { cache: 'no-store', redirect: 'follow' })
      .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
      .then(render)
      .catch(function (err) {
        if (hasRendered) {
          document.getElementById('updatedAt').textContent = 'Refresh failed — showing last known standings';
        } else {
          showError('Couldn’t load leaderboard data (' + err.message + '). Check the data source URL and the web app deployment.');
        }
      });
  }

  function refresh() {
    if (hasAppsScript()) {
      google.script.run.withSuccessHandler(render).withFailureHandler(function () {
        document.getElementById('updatedAt').textContent = 'Refresh failed — showing last known standings';
      }).getLeaderboardData();
    } else {
      fetchData();
    }
  }

  // Apps Script mode: instant paint from server-rendered data. Static mode: the
  // template line below becomes `null`, so the page fetches straight away.
  var INITIAL_DATA = null;
  if (INITIAL_DATA) {
    render(INITIAL_DATA);
  } else {
    fetchData();
    setTimeout(function () { window.location.reload(); }, RELOAD_MS);
  }
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
